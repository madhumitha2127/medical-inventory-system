{% extends "base.html" %}
{% block title %}Edit Medicine{% endblock %}

{% block content %}
<style>
    .card {
        background: white;
        border-radius: 16px;
        padding: 32px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        max-width: 800px;
        margin: 0 auto;
        animation: fadeIn 0.5s ease;
    }
    .form-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 20px;
    }
    .form-group-full {
        grid-column: span 2;
    }
    label {
        display: block;
        font-size: 0.82rem;
        font-weight: 600;
        color: #888;
        margin-bottom: 8px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
    }
    input, select {
        width: 100%;
        padding: 12px 14px;
        border: 1px solid #eee;
        border-radius: 10px;
        font-size: 0.95rem;
        transition: all 0.3s;
        outline: none;
    }
    input:focus, select:focus {
        border-color: #00c9a7;
        box-shadow: 0 0 0 3px rgba(0,201,167,0.1);
    }
    .btn-update {
        background: linear-gradient(135deg, #00c9a7, #007cf0);
        color: white;
        border: none;
        padding: 14px 28px;
        border-radius: 10px;
        font-weight: 700;
        cursor: pointer;
        font-size: 1rem;
        transition: all 0.3s;
        margin-top: 16px;
    }
    .btn-update:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(0,201,167,0.3);
    }
    .btn-cancel {
        background: #f0f2f5;
        color: #666;
        border: none;
        padding: 14px 28px;
        border-radius: 10px;
        font-weight: 700;
        cursor: pointer;
        font-size: 1rem;
        transition: all 0.3s;
        margin-top: 16px;
        text-decoration: none;
        display: inline-block;
        text-align: center;
        margin-right: 12px;
    }
    .btn-cancel:hover {
        background: #e4e6eb;
        color: #1a1a2e;
    }
    .img-preview-box {
        display: flex;
        align-items: center;
        gap: 16px;
        background: #f9f9f9;
        padding: 16px;
        border-radius: 12px;
        border: 1px dashed #ddd;
        margin-top: 8px;
    }
    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(15px); }
        to { opacity: 1; transform: translateY(0); }
    }
</style>

<div style="max-width:800px; margin:0 auto 24px auto;">
    <a href="/inventory" style="text-decoration:none; color:#007cf0; font-weight:600; font-size:0.95rem;">← Back to Inventory</a>
    <h2 style="color:#1a1a2e; font-weight:700; margin-top:12px;">✏️ Edit Medicine</h2>
</div>

<div class="card">
    <form method="POST" action="/edit_medicine/{{ medicine.id }}" enctype="multipart/form-data">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
        
        <div class="form-grid">
            <div>
                <label>Medicine Name</label>
                <input type="text" name="name" value="{{ medicine.name }}" required/>
            </div>
            
            <div>
                <label>Quantity</label>
                <input type="number" name="quantity" value="{{ medicine.quantity }}" required/>
            </div>
            
            <div>
                <label>Price (Rs.)</label>
                <input type="number" step="0.01" name="price" value="{{ medicine.price }}" required/>
            </div>
            
            <div>
                <label>Expiry Date</label>
                <input type="date" name="expiry_date" value="{{ medicine.expiry_date }}" required/>
            </div>
            
            <div>
                <label>Supplier</label>
                <select name="supplier">
                    <option value="">-- Select Supplier --</option>
                    {% for s in suppliers %}
                    <option value="{{ s.name }}" {% if medicine.supplier == s.name %}selected{% endif %}>{{ s.name }}</option>
                    {% endfor %}
                </select>
            </div>
            
            <div>
                <label>Dosage</label>
                <input type="text" name="dosage" value="{{ medicine.dosage or '' }}" placeholder="e.g. 1 tablet twice daily"/>
            </div>
            
            <div class="form-group-full">
                <label>Restrictions</label>
                <input type="text" name="restrictions" value="{{ medicine.restrictions or '' }}" placeholder="e.g. Avoid alcohol"/>
            </div>
            
            <div class="form-group-full">
                <label>Side Effects</label>
                <input type="text" name="side_effects" value="{{ medicine.side_effects or '' }}" placeholder="e.g. Nausea, Drowsiness"/>
            </div>
            
            <div class="form-group-full">
                <label>Medicine Image</label>
                <input type="file" name="image" accept="image/*" style="border:none; padding:8px 0;"/>
                {% if medicine.image %}
                <div class="img-preview-box">
                    <img src="/{{ medicine.image }}" style="max-height: 80px; border-radius: 8px; border: 1px solid #eee; background:#fff; object-fit:contain; width:80px;" alt="Medicine Preview"/>
                    <div>
                        <p style="font-weight:600; color:#333; font-size:0.85rem; margin-bottom:2px;">Existing Image</p>
                        <p style="font-size:0.75rem; color:#888;">Uploading a new image will replace this one safely.</p>
                    </div>
                </div>
                {% endif %}
            </div>
        </div>
        
        <div style="display:flex; justify-content:flex-end; margin-top:24px;">
            <a href="/inventory" class="btn-cancel">Cancel</a>
            <button type="submit" class="btn-update">💾 Save Changes</button>
        </div>
    </form>
</div>
{% endblock %}
